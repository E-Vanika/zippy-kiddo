---
- name: Bootstrap the Zippy Kiddo Always Free VM
  hosts: vm
  become: true

  vars:
    app_dir: /opt/zippy-kiddo
    swap_size_gb: 2

  tasks:
    - name: Wait for first-boot cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    # Remove a partially configured third-party Docker repository left by an
    # interrupted bootstrap. Ubuntu's signed packages are sufficient here and
    # integrate with unattended security updates.
    - name: Remove third-party Docker apt sources
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.sources
        - /etc/apt/sources.list.d/docker.list

    - name: Install base packages and Docker from Ubuntu
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - docker.io
          - docker-compose-v2
          - ufw
          - unattended-upgrades
        state: present
        update_cache: true
        cache_valid_time: 0
        lock_timeout: 300

    - name: Add ubuntu to the Docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Enable Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Check for swapfile
      ansible.builtin.stat:
        path: /swapfile
      register: swapfile

    - name: Create swapfile
      ansible.builtin.command: fallocate -l {{ swap_size_gb }}G /swapfile
      when: not swapfile.stat.exists

    - name: Protect swapfile
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"
      when: not swapfile.stat.exists

    - name: Format swapfile
      ansible.builtin.command: mkswap /swapfile
      when: not swapfile.stat.exists

    - name: Enable swapfile now
      ansible.builtin.command: swapon /swapfile
      when: not swapfile.stat.exists

    - name: Persist swapfile
      ansible.posix.mount:
        path: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present

    - name: Configure firewall defaults
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Allow rate-limited SSH
      community.general.ufw:
        rule: limit
        port: "22"
        proto: tcp

    - name: Allow web traffic
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "80"
        - "443"

    - name: Enable firewall
      community.general.ufw:
        state: enabled

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0750"

    - name: Enable unattended security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

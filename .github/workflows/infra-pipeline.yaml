name: OCI Terraform Infra Pipeline

on:

  # ============================================================
  # SECURITY CHECKS ON PULL REQUEST
  # ============================================================

  pull_request:
    branches:
      - main

  # ============================================================
  # DEPLOY AFTER MERGE
  # ============================================================

  push:
    branches:
      - main

  # ============================================================
  # MANUAL RUN
  # ============================================================

  workflow_dispatch:

  # ============================================================
  # RETRY EVERY 5 MINUTES
  #
  # GitHub cron is UTC.
  # This is approximately every 5 minutes.
  # ============================================================

  schedule:
    - cron: "*/5 * * * *"


# ==============================================================
# PERMISSIONS
# ==============================================================

permissions:
  contents: read


# ==============================================================
# GLOBAL ENVIRONMENT
# ==============================================================

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"


# ==============================================================
# PREVENT SIMULTANEOUS TERRAFORM RUNS
#
# IMPORTANT for 5-minute scheduling.
# ==============================================================
concurrency:
  group: oci-terraform-production
  cancel-in-progress: false


jobs:

  # ============================================================
  # DEVSECOPS
  # ============================================================

  security:

    name: Terraform DevSecOps Security

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # TERRAFORM
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1


      - name: Terraform Format
        working-directory: ./terraform
        run: |
          terraform fmt -check -recursive


      - name: Terraform Init
        run: |
          terraform init


      - name: Terraform Validate
        run: |
          terraform validate


      # --------------------------------------------------------
      # TRIVY
      # --------------------------------------------------------

      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ./terraform
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table


      # --------------------------------------------------------
      # GITLEAKS
      # --------------------------------------------------------

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # DEPLOYMENT
  # ============================================================

  deploy:

    name: A1 Capacity Attempt

    needs:
      - security

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'

    runs-on: ubuntu-latest


    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # TERRAFORM
      # ========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1


      # ========================================================
      # CREATE TEMPORARY OCI PRIVATE KEY
      # ========================================================

      - name: Create OCI private key
        shell: bash
        run: |

          printf '%s\n' "${{ secrets.OCI_PRIVATE_KEY }}" \
            > "${{ runner.temp }}/oci_api_key.pem"

          chmod 600 "${{ runner.temp }}/oci_api_key.pem"


      # ========================================================
      # TERRAFORM INIT
      #
      # IMPORTANT:
      # OCI_* variables are for the OCI remote backend.
      # TF_VAR_* variables are for the OCI provider.
      # ========================================================

      - name: Terraform Init
        working-directory: ./terraform

        env:

          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}

          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}

          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}

          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci_api_key.pem

          OCI_REGION: ${{ secrets.OCI_REGION }}

        run: |

          terraform init -upgrade


      # ========================================================
      # A1 CAPACITY ATTEMPT
      # ========================================================

      - name: Try A1 Always Free (terraform plan and terraform apply)

        env:

          # ----------------------------------------------------
          # TERRAFORM PROVIDER
          # ----------------------------------------------------

          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}

          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}

          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}

          TF_VAR_private_key_path: ${{ runner.temp }}/oci_api_key.pem

          TF_VAR_region: ${{ secrets.OCI_REGION }}

          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

          # ----------------------------------------------------
          # HARD A1 LOCK
          # ----------------------------------------------------

          TF_VAR_instance_shape: "VM.Standard.A1.Flex"

        shell: bash

        run: |

          set -uo pipefail

          echo ""
          echo "======================================================"
          echo "        OCI ALWAYS FREE A1 CAPACITY CHECK"
          echo "======================================================"

          echo ""
          echo "Shape: VM.Standard.A1.Flex"
          echo "OCPU : 1"
          echo "RAM  : 6 GB"
          echo ""


          # ==================================================
          # HARD SAFETY CHECK
          # ==================================================

          if [[ "${TF_VAR_instance_shape}" != "VM.Standard.A1.Flex" ]]; then

            echo "SECURITY ERROR"
            echo "Only A1 Flex is allowed."

            exit 1

          fi


          # ==================================================
          # CHECK CURRENT STATE
          # ==================================================

          echo "Checking Terraform state..."

          terraform state list || true


          # ==================================================
          # FAULT DOMAIN OPTIONS
          # ==================================================

          FAULT_DOMAINS=(
            ""
            "FAULT-DOMAIN-1"
            "FAULT-DOMAIN-2"
            "FAULT-DOMAIN-3"
          )


          success=0


          # ==================================================
          # TRY PLACEMENTS
          # ==================================================

          for fd in "${FAULT_DOMAINS[@]}"; do

            echo ""

            if [[ -z "$fd" ]]; then

              echo "------------------------------------------------------"
              echo "Trying OCI automatic placement"
              echo "------------------------------------------------------"

              export TF_VAR_fault_domain=""

            else

              echo "------------------------------------------------------"
              echo "Trying $fd"
              echo "------------------------------------------------------"

              export TF_VAR_fault_domain="$fd"

            fi


            rm -f tfplan


            # ==================================================
            # PLAN
            # ==================================================

            terraform plan -out=tfplan


            # ==================================================
            # APPLY
            # ==================================================

            echo ""
            echo "Attempting A1 creation..."

            if terraform apply -auto-approve tfplan; then

              echo ""
              echo "======================================================"
              echo "       🎉 A1 VM CREATED SUCCESSFULLY 🎉"
              echo "======================================================"

              success=1

              break

            else

              echo ""
              echo "A1 attempt failed."
              echo "Likely OCI capacity unavailable."

              rm -f tfplan

            fi

          done


          # ==================================================
          # FINAL RESULT
          # ==================================================

          if [[ "$success" -ne 1 ]]; then

            echo ""
            echo "======================================================"
            echo "       A1 CAPACITY NOT AVAILABLE"
            echo "======================================================"

            echo ""
            echo "No A1 capacity was available."
            echo ""
            echo "The next scheduled run will retry."
            echo ""
            echo "No E2 fallback."
            echo "No paid shape fallback."

            exit 1

          fi


      # ========================================================
      # OUTPUT
      # ========================================================

      - name: Show VM information
        if: success()
        working-directory: ./terraform
        run: |

          echo ""
          echo "======================================================"
          echo "                 A1 VM INFORMATION"
          echo "======================================================"

          terraform output


      # ========================================================
      # CLEAN PRIVATE KEY
      # ========================================================

      - name: Cleanup private key
        if: always()
        shell: bash
        run: |

          rm -f "${{ runner.temp }}/oci_api_key.pem"
name: OCI Terraform Infra Pipeline

# ============================================================
# TRIGGERS
# ============================================================

on:

  # Validate infrastructure changes in PRs
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infra-pipeline.yaml"

  # Deploy changes merged to main
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infra-pipeline.yaml"

  # Manual deployment
  workflow_dispatch:

  # Retry A1 capacity hourly, away from the busiest minute boundary
  #
  # GitHub Actions scheduled workflows use UTC.
  #
  schedule:
    - cron: "17 * * * *"


# ============================================================
# GLOBAL PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"


# ============================================================
# CONCURRENCY
#
# Prevent two Terraform operations from running at the same
# time against the same infrastructure.
# ============================================================

concurrency:
  group: oci-production-terraform
  cancel-in-progress: false


jobs:

  # ============================================================
  # JOB 1
  # DEVSECOPS / STATIC VALIDATION
  # ============================================================

  security:

    name: DevSecOps - Terraform Security

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # TERRAFORM
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.13.1
          terraform_wrapper: false


      # --------------------------------------------------------
      # TERRAFORM FORMAT
      # --------------------------------------------------------

      - name: Terraform Format Check
        working-directory: ./terraform
        run: |
          terraform fmt -check -recursive


      # --------------------------------------------------------
      # TERRAFORM INIT
      #
      # Backend is disabled here because this is only a
      # validation/security job.
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init -backend=false


      # --------------------------------------------------------
      # TERRAFORM VALIDATE
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: ./terraform
        run: |
          terraform validate


      # --------------------------------------------------------
      # TRIVY IaC SCAN
      # --------------------------------------------------------

      - name: Trivy Infrastructure Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./terraform
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table


      # --------------------------------------------------------
      # GITLEAKS
      # --------------------------------------------------------

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # JOB 2
  # TERRAFORM DEPLOYMENT
  # ============================================================

  deploy:

    name: Terraform - OCI Free Compute Deployment

    needs:
      - security

    # Don't deploy for pull requests.
    #
    # Scheduled runs, pushes and manual runs can deploy.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'

    runs-on: ubuntu-latest


    # ----------------------------------------------------------
    # GitHub Environment
    #
    # Create "production" under:
    #
    # Settings → Environments
    #
    # You can later add approval rules here.
    # ----------------------------------------------------------

    environment:
      name: production


    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout source
        uses: actions/checkout@v7


      # ========================================================
      # TERRAFORM
      # ========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.13.1
          terraform_wrapper: false


      # ========================================================
      # CREATE TEMPORARY OCI PRIVATE KEY
      # ========================================================

      - name: Create temporary OCI private key
        shell: bash
        run: |

          set -euo pipefail

          printf '%s\n' "${{ secrets.OCI_PRIVATE_KEY }}" \
            > "${{ runner.temp }}/oci_api_key.pem"

          chmod 600 "${{ runner.temp }}/oci_api_key.pem"


      # ========================================================
      # TERRAFORM INIT
      #
      # OCI BACKEND CREDENTIALS ARE PROVIDED AT RUNTIME.
      #
      # Nothing sensitive is stored in backend.tf.
      # ========================================================

      - name: Terraform Init - Remote OCI State
        working-directory: ./terraform

        env:

          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}

          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}

          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}

          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci_api_key.pem

          OCI_REGION: ${{ secrets.OCI_REGION }}

        shell: bash

        run: |

          set -euo pipefail

          terraform init -upgrade \
            -backend-config="tenancy_ocid=${OCI_TENANCY_OCID}" \
            -backend-config="user_ocid=${OCI_USER_OCID}" \
            -backend-config="fingerprint=${OCI_FINGERPRINT}" \
            -backend-config="private_key_path=${OCI_PRIVATE_KEY_PATH}"


      # ========================================================
      # E2 FALLBACK PLAN
      # ========================================================

      - name: Terraform Plan - E2 fallback
        working-directory: ./terraform

        env:

          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}

          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}

          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}

          TF_VAR_private_key_path: ${{ runner.temp }}/oci_api_key.pem

          TF_VAR_region: ${{ secrets.OCI_REGION }}

          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

        shell: bash

        run: |

          set -euo pipefail

          echo ""
          echo "======================================================"
          echo "             E2 FALLBACK PLAN"
          echo "======================================================"

          terraform plan \
            -target=oci_core_instance.e2_micro_vm \
            -out=e2.tfplan


      # ========================================================
      # VERIFY E2 PLAN
      # ========================================================

      - name: Verify E2 fallback shape
        working-directory: ./terraform

        shell: bash

        run: |

          set -euo pipefail

          echo "Checking E2 fallback plan..."

          terraform show -no-color e2.tfplan > e2-plan.txt


          # ----------------------------------------------------
          # IF COMPUTE IS CREATED, IT MUST BE THE FREE E2 SHAPE
          # ----------------------------------------------------

          if grep -q "oci_core_instance.e2_micro_vm" e2-plan.txt; then

            if ! grep -q "VM.Standard.E2.1.Micro" e2-plan.txt; then

              echo ""
              echo "SECURITY FAILURE"
              echo "E2 fallback is not VM.Standard.E2.1.Micro."

              exit 1

            fi

          fi


          echo ""
          echo "E2 shape validation passed."


      # ========================================================
      # APPLY E2 FALLBACK FIRST
      # ========================================================

      - name: Terraform Apply - E2 fallback
        working-directory: ./terraform

        env:

          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}

          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}

          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}

          TF_VAR_private_key_path: ${{ runner.temp }}/oci_api_key.pem

          TF_VAR_region: ${{ secrets.OCI_REGION }}

          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

        shell: bash

        run: |

          set -uo pipefail

          echo ""
          echo "======================================================"
          echo "       OCI E2 ALWAYS FREE FALLBACK"
          echo "======================================================"

          echo ""
          echo "Shape : VM.Standard.E2.1.Micro"
          echo ""

          if terraform apply \
              -auto-approve \
              e2.tfplan; then

            echo ""
            echo "======================================================"
            echo "        E2 FALLBACK IS READY"
            echo "======================================================"

          else

            echo ""
            echo "======================================================"
            echo "       E2 FALLBACK DEPLOYMENT FAILED"
            echo "======================================================"

            echo ""
            echo "Review the Terraform and OCI errors above."

            exit 1

          fi


      # ========================================================
      # FULL PLAN - RETRY THE A1 AFTER E2 IS SAFE
      # ========================================================

      - name: Terraform Plan - A1 retry
        working-directory: ./terraform
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci_api_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          terraform plan -out=a1.tfplan


      # ========================================================
      # ALLOW ONLY THE TWO OCI ALWAYS FREE COMPUTE SHAPES
      # ========================================================

      - name: Verify free compute shapes
        working-directory: ./terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform show -json a1.tfplan > a1-plan.json

          mapfile -t shapes < <(
            jq -r '
              .resource_changes[]?
              | select(.type == "oci_core_instance")
              | .change.after.shape // empty
            ' a1-plan.json | sort -u
          )

          for shape in "${shapes[@]}"; do
            case "${shape}" in
              VM.Standard.A1.Flex|VM.Standard.E2.1.Micro)
                echo "Allowed Always Free shape: ${shape}"
                ;;
              *)
                echo "SECURITY FAILURE: prohibited compute shape ${shape}"
                exit 1
                ;;
            esac
          done


      # ========================================================
      # APPLY FULL PLAN; AN A1 CAPACITY FAILURE DOES NOT REMOVE E2
      # ========================================================

      - name: Terraform Apply - A1 retry
        working-directory: ./terraform
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci_api_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        shell: bash
        run: |
          set -uo pipefail

          set +e
          terraform apply -auto-approve a1.tfplan 2>&1 | tee a1-apply.log
          apply_status=${PIPESTATUS[0]}
          set -e

          if [ "${apply_status}" -eq 0 ]; then
            echo "A1 instance is ready."
          elif grep -qi "Out of host capacity" a1-apply.log; then
            echo "::warning::OCI currently has no A1 host capacity. The E2 fallback remains deployed and the scheduled workflow will retry A1."
            exit 0
          else
            echo "A1 deployment failed for a reason other than host capacity."
            exit "${apply_status}"
          fi


      # ========================================================
      # TERRAFORM OUTPUT
      # ========================================================

      - name: Display Infrastructure Outputs
        if: success()
        working-directory: ./terraform

        run: |

          echo ""
          echo "======================================================"
          echo "             INFRASTRUCTURE OUTPUT"
          echo "======================================================"

          terraform output


      # ========================================================
      # CLEAN SENSITIVE MATERIAL
      # ========================================================

      - name: Cleanup OCI private key
        if: always()
        shell: bash
        run: |

          rm -f "${{ runner.temp }}/oci_api_key.pem"

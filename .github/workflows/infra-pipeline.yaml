name: OCI Terraform Infra Pipeline

# ============================================================
# TRIGGERS
# ============================================================

on:

  # Validate infrastructure changes in PRs
  pull_request:
    branches:
      - main

  # Deploy changes merged to main
  push:
    branches:
      - main

  # Manual deployment
  workflow_dispatch:

  # Retry A1 capacity approximately every 10 minutes
  #
  # GitHub Actions scheduled workflows use UTC.
  #
  schedule:
    - cron: "*/10 * * * *"


# ============================================================
# GLOBAL PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"


# ============================================================
# CONCURRENCY
#
# Prevent two Terraform operations from running at the same
# time against the same infrastructure.
# ============================================================

concurrency:
  group: oci-production-terraform
  cancel-in-progress: false


jobs:

  # ============================================================
  # JOB 1
  # DEVSECOPS / STATIC VALIDATION
  # ============================================================

  security:

    name: DevSecOps - Terraform Security

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # TERRAFORM
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1


      # --------------------------------------------------------
      # TERRAFORM FORMAT
      # --------------------------------------------------------

      - name: Terraform Format Check
        working-directory: ./terraform
        run: |
          terraform fmt -check -recursive


      # --------------------------------------------------------
      # TERRAFORM INIT
      #
      # Backend is disabled here because this is only a
      # validation/security job.
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init -backend=false


      # --------------------------------------------------------
      # TERRAFORM VALIDATE
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: ./terraform
        run: |
          terraform validate


      # --------------------------------------------------------
      # TRIVY IaC SCAN
      # --------------------------------------------------------

      - name: Trivy Infrastructure Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ./terraform
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table


      # --------------------------------------------------------
      # GITLEAKS
      # --------------------------------------------------------

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # JOB 2
  # TERRAFORM DEPLOYMENT
  # ============================================================

  deploy:

    name: Terraform - OCI A1 Deployment

    needs:
      - security

    # Don't deploy for pull requests.
    #
    # Scheduled runs, pushes and manual runs can deploy.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'

    runs-on: ubuntu-latest


    # ----------------------------------------------------------
    # GitHub Environment
    #
    # Create "production" under:
    #
    # Settings → Environments
    #
    # You can later add approval rules here.
    # ----------------------------------------------------------

    environment:
      name: production


    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ========================================================
      # TERRAFORM
      # ========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1


      # ========================================================
      # CREATE TEMPORARY OCI PRIVATE KEY
      # ========================================================

      - name: Create temporary OCI private key
        shell: bash
        run: |

          set -euo pipefail

          printf '%s\n' "${{ secrets.OCI_PRIVATE_KEY }}" \
            > "${{ runner.temp }}/oci_api_key.pem"

          chmod 600 "${{ runner.temp }}/oci_api_key.pem"


      # ========================================================
      # TERRAFORM INIT
      #
      # OCI BACKEND CREDENTIALS ARE PROVIDED AT RUNTIME.
      #
      # Nothing sensitive is stored in backend.tf.
      # ========================================================

      - name: Terraform Init - Remote OCI State
        working-directory: ./terraform

        env:

          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}

          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}

          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}

          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oci_api_key.pem

          OCI_REGION: ${{ secrets.OCI_REGION }}

        shell: bash

        run: |

          set -euo pipefail

          terraform init -upgrade \
            -backend-config="tenancy_ocid=${OCI_TENANCY_OCID}" \
            -backend-config="user_ocid=${OCI_USER_OCID}" \
            -backend-config="fingerprint=${OCI_FINGERPRINT}" \
            -backend-config="private_key_path=${OCI_PRIVATE_KEY_PATH}"


      # ========================================================
      # TERRAFORM PLAN
      # ========================================================

      - name: Terraform Plan
        working-directory: ./terraform

        env:

          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}

          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}

          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}

          TF_VAR_private_key_path: ${{ runner.temp }}/oci_api_key.pem

          TF_VAR_region: ${{ secrets.OCI_REGION }}

          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

        shell: bash

        run: |

          set -euo pipefail

          echo ""
          echo "======================================================"
          echo "                TERRAFORM PLAN"
          echo "======================================================"

          terraform plan \
            -out=tfplan


      # ========================================================
      # VERIFY TERRAFORM PLAN
      #
      # Hard safety check:
      #
      # We do NOT allow the old E2 Micro.
      # ========================================================

      - name: Verify A1-only deployment
        working-directory: ./terraform

        shell: bash

        run: |

          set -euo pipefail

          echo "Checking Terraform plan for prohibited shapes..."

          terraform show -no-color tfplan > plan.txt


          # ----------------------------------------------------
          # E2 MUST NEVER APPEAR
          # ----------------------------------------------------

          if grep -q "VM.Standard.E2.1.Micro" plan.txt; then

            echo ""
            echo "SECURITY FAILURE"
            echo "VM.Standard.E2.1.Micro detected."
            echo "Deployment blocked."

            exit 1

          fi


          # ----------------------------------------------------
          # A1 MUST APPEAR IF COMPUTE IS BEING CREATED
          # ----------------------------------------------------

          if grep -q "oci_core_instance.free_vm" plan.txt; then

            if ! grep -q "VM.Standard.A1.Flex" plan.txt; then

              echo ""
              echo "SECURITY FAILURE"
              echo "Compute resource does not appear to be A1 Flex."

              exit 1

            fi

          fi


          echo ""
          echo "A1 shape validation passed."


      # ========================================================
      # TERRAFORM APPLY
      #
      # ONE APPLY PER RUN.
      #
      # If OCI has no A1 capacity, this run fails.
      # The next scheduled run will retry.
      # ========================================================

      - name: Terraform Apply
        working-directory: ./terraform

        env:

          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}

          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}

          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}

          TF_VAR_private_key_path: ${{ runner.temp }}/oci_api_key.pem

          TF_VAR_region: ${{ secrets.OCI_REGION }}

          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

        shell: bash

        run: |

          set -uo pipefail

          echo ""
          echo "======================================================"
          echo "       OCI A1 ALWAYS FREE DEPLOYMENT"
          echo "======================================================"

          echo ""
          echo "Shape : VM.Standard.A1.Flex"
          echo "OCPU  : 1"
          echo "RAM   : 6 GB"
          echo ""

          if terraform apply \
              -auto-approve \
              tfplan; then

            echo ""
            echo "======================================================"
            echo "        A1 INSTANCE DEPLOYED SUCCESSFULLY"
            echo "======================================================"

          else

            echo ""
            echo "======================================================"
            echo "       A1 DEPLOYMENT FAILED"
            echo "======================================================"

            echo ""
            echo "OCI may currently have no A1 host capacity."
            echo ""
            echo "This pipeline does NOT:"
            echo "  - fall back to E2 Micro"
            echo "  - create a paid shape"
            echo "  - create another compute shape"
            echo ""
            echo "The scheduled workflow will try again."

            exit 1

          fi


      # ========================================================
      # TERRAFORM OUTPUT
      # ========================================================

      - name: Display Infrastructure Outputs
        if: success()
        working-directory: ./terraform

        run: |

          echo ""
          echo "======================================================"
          echo "             INFRASTRUCTURE OUTPUT"
          echo "======================================================"

          terraform output


      # ========================================================
      # UPLOAD PLAN
      # ========================================================

      - name: Upload Terraform Plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_number }}
          path: ./terraform/tfplan
          retention-days: 1
          if-no-files-found: ignore


      # ========================================================
      # CLEAN SENSITIVE MATERIAL
      # ========================================================

      - name: Cleanup OCI private key
        if: always()
        shell: bash
        run: |

          rm -f "${{ runner.temp }}/oci_api_key.pem"
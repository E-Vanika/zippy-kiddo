name: OCI Terraform Infra Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  # =========================================================
  # SECURITY + VALIDATION
  # =========================================================
  security:
    name: Terraform DevSecOps Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1

      - name: Terraform Format
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ./terraform
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================
  # DEPLOYMENT ENGINE (PLAN & CAPACITY CONQUER)
  # =========================================================
  deploy:
    name: Terraform Deployment Engine
    needs: security
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1

      - name: Create OCI API private key
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.OCI_PRIVATE_KEY }}" > "${{ runner.temp }}/oci_api_key.pem"
          chmod 600 "${{ runner.temp }}/oci_api_key.pem"

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Capacity Fault Domain Sweep
        working-directory: ./terraform
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: ${{ runner.temp }}/oci_api_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        shell: bash
        run: |
          # Sweep through the three separate hardware groups (fault domains) in Hyderabad
          FD_LIST=("FAULT-DOMAIN-1" "FAULT-DOMAIN-2" "FAULT-DOMAIN-3")
          deploy_succeeded=0

          for fd in "${FD_LIST[@]}"; do
            echo "------------------------------------------------------"
            echo "Attempting deployment in Target Fault Domain: $fd"
            echo "------------------------------------------------------"

            export TF_VAR_fault_domain="$fd"

            if ! terraform plan -out=tfplan; then
              echo "Plan generation failed for $fd. Skipping."
              continue
            fi

            if terraform apply -auto-approve tfplan; then
              echo "Success! Infrastructure deployed successfully in $fd"
              deploy_succeeded=1
              break
            else
              echo "Apply failed (Out of capacity) in $fd. Trying next fault domain..."
              rm -f tfplan
            fi
          done

          if [ "$deploy_succeeded" -ne 1 ]; then
            echo "ERROR: Resource allocation completely failed across all hardware tracks in ap-hyderabad-1." >&2
            exit 1
          fi

      - name: Upload Terraform Plan Output
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ./terraform/tfplan
          retention-days: 1

      - name: Show VM information
        working-directory: ./terraform
        run: |
          echo "======================================================"
          echo "              DEPLOYMENT OUTPUT DATA                  "
          echo "======================================================"
          terraform output

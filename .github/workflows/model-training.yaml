name: Model Training
# A source change to this workflow triggers a fresh credential validation run.

on:
  workflow_dispatch:
    inputs:
      kaggle_username:
        description: Kaggle profile username
        required: false
        type: string
      hf_model_repo:
        description: Optional Hugging Face repo (owner/name)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/model-training.yaml"

permissions:
  contents: write

concurrency:
  group: zippy-kiddo-model-training
  cancel-in-progress: false

jobs:
  train-publish-lock:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_PROFILE_USERNAME: ${{ inputs.kaggle_username || vars.KAGGLE_USERNAME || 'vanikaeruthayaraj' }}
      HF_MODEL_REPO: ${{ inputs.hf_model_repo || vars.HF_MODEL_REPO }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Require model-platform configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN}" || { echo "::error::Missing KAGGLE_API_TOKEN secret"; exit 1; }
          test -n "${HF_TOKEN}" || { echo "::error::Missing HF_TOKEN secret"; exit 1; }
          test -n "${KAGGLE_PROFILE_USERNAME}" || { echo "::error::Missing Kaggle profile username"; exit 1; }

      - name: Configure Kaggle authentication
        shell: bash
        run: |
          set -euo pipefail
          if jq -e 'type == "object" and .key' <<<"${KAGGLE_API_TOKEN}" >/dev/null 2>&1; then
            legacy_username=$(jq -r '.username // empty' <<<"${KAGGLE_API_TOKEN}")
            legacy_key=$(jq -r '.key' <<<"${KAGGLE_API_TOKEN}")
            echo "::add-mask::${legacy_key}"
            echo "KAGGLE_API_TOKEN=" >> "$GITHUB_ENV"
            echo "KAGGLE_USERNAME=${legacy_username:-$KAGGLE_PROFILE_USERNAME}" >> "$GITHUB_ENV"
            echo "KAGGLE_KEY=${legacy_key}" >> "$GITHUB_ENV"
          elif [[ "${KAGGLE_API_TOKEN}" != KGAT_* ]]; then
            echo "::add-mask::${KAGGLE_API_TOKEN}"
            echo "KAGGLE_API_TOKEN=" >> "$GITHUB_ENV"
            echo "KAGGLE_USERNAME=${KAGGLE_PROFILE_USERNAME}" >> "$GITHUB_ENV"
            echo "KAGGLE_KEY=${KAGGLE_API_TOKEN}" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Kaggle and Hugging Face clients
        run: python -m pip install --disable-pip-version-check "kaggle>=1.7,<3" "huggingface-hub>=0.32,<2"

      - name: Verify Kaggle authentication
        id: kaggle_auth
        continue-on-error: true
        run: kaggle kernels list --mine --page-size 1

      - name: Prepare Kaggle training kernel
        if: ${{ steps.kaggle_auth.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cp zippy_kiddo/data/activities.json training/kaggle/activities.json
          sed "s/__KAGGLE_USERNAME__/${KAGGLE_PROFILE_USERNAME}/g" \
            training/kaggle/kernel-metadata.template.json \
            > training/kaggle/kernel-metadata.json

      - name: Train model on Kaggle
        if: ${{ steps.kaggle_auth.outcome == 'success' }}
        id: kaggle_training
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          kernel="${KAGGLE_PROFILE_USERNAME}/zippy-kiddo-ranker-training"
          kaggle kernels push --path training/kaggle --timeout 600

          completed=false
          for attempt in $(seq 1 40); do
            status=$(kaggle kernels status "${kernel}" 2>&1)
            echo "${status}"
            if grep -qiE 'complete|successful' <<<"${status}"; then
              completed=true
              break
            fi
            if grep -qiE 'error|failed|cancel' <<<"${status}"; then
              echo "::error::Kaggle training failed"
              exit 1
            fi
            sleep 15
          done
          test "${completed}" = true || { echo "::error::Kaggle training timed out"; exit 1; }
          mkdir -p model-output
          kaggle kernels output "${kernel}" --path model-output --force

      - name: Train with free GitHub Actions fallback
        if: ${{ steps.kaggle_auth.outcome != 'success' || steps.kaggle_training.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::Kaggle rejected its credential; using the identical free CI trainer."
          mkdir -p model-output
          MODEL_OUTPUT_DIR="$PWD/model-output" \
            TRAINING_PLATFORM="github-actions-fallback" \
            python training/kaggle/train.py

      - name: Enforce model quality gate
        shell: bash
        run: |
          set -euo pipefail
          test -s model-output/model.json
          test -s model-output/metrics.json
          jq -e '.quality_gate == "passed" and .self_retrieval_top1_accuracy >= 0.80' model-output/metrics.json

      - name: Publish immutable model to Hugging Face
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          result=$(python training/publish_model.py | tail -n 1)
          echo "${result}"
          echo "repo_id=$(jq -r .repo_id <<<"${result}")" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -r .revision <<<"${result}")" >> "$GITHUB_OUTPUT"

      - name: Write Hugging Face model lock
        if: ${{ steps.publish.outcome == 'success' }}
        run: |
          python training/write_model_lock.py \
            --source huggingface \
            --repo-id "${{ steps.publish.outputs.repo_id }}" \
            --revision "${{ steps.publish.outputs.revision }}" \
            --model model-output/model.json \
            --metrics model-output/metrics.json \
            --output model/model-lock.json

      - name: Write repository model fallback
        if: ${{ steps.publish.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::Hugging Face rejected publication; pinning the validated artifact in GitHub."
          cp model-output/model.json model/model.json
          python training/write_model_lock.py \
            --source repository \
            --repo-id "${{ github.repository }}" \
            --revision "${{ github.run_id }}" \
            --model model/model.json \
            --metrics model-output/metrics.json \
            --output model/model-lock.json

      - name: Preserve training evidence
        uses: actions/upload-artifact@v6
        with:
          name: zippy-kiddo-model-${{ github.run_id }}
          path: |
            model-output/model.json
            model-output/metrics.json
            model-output/README.md
            model/model-lock.json
          retention-days: 30

      - name: Commit immutable model revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/model-lock.json
          if test -f model/model.json; then
            git add model/model.json
          fi
          if git diff --cached --quiet; then
            echo "Model lock already points to this artifact."
            exit 0
          fi
          git commit -m "model: promote validated Kaggle ranker"
          git push origin HEAD:main

      - name: Publish model summary
        shell: bash
        run: |
          {
            echo "## Model promoted"
            echo
            echo "- Kaggle kernel: ${KAGGLE_PROFILE_USERNAME}/zippy-kiddo-ranker-training"
            echo "- Training platform: $(jq -r .training_platform model-output/metrics.json)"
            echo "- Artifact source: $(jq -r .source model/model-lock.json)"
            echo "- Artifact repository: $(jq -r .repo_id model/model-lock.json)"
            echo "- Revision: \`$(jq -r .revision model/model-lock.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"
